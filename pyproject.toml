[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-flame"
version = "0.1.0"
description = "Visual Flamegraph & Cognitive Uncertainty Profiler for Agent Extended Thinking Traces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" }
]
keywords = [
    "flamegraph",
    "reasoning-traces",
    "extended-thinking",
    "observability",
    "claude-opus-5-5",
    "gpt-6-astra",
    "ai-agents"
]
dependencies = []

[project.scripts]
thought-flame = "thought_flame.cli:main"
